<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>

body{
 background:#000;
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh;
 margin:0;
 font-family:'Segoe UI', Orbitron, sans-serif;
 color:#00f2ff;
 overflow:hidden;
}

.hud-container{
 position:relative;
 width:600px;
 height:600px;
 display:flex;
 justify-content:center;
 align-items:center;
}

/* TITLE */
.title{
 position:absolute;
 top:20px;
 text-align:center;
 letter-spacing:3px;
}
.title h1{font-size:24px;margin:0}
.title p{font-size:10px;margin:0;opacity:.8}

/* RINGS */
.ring{
 position:absolute;
 border-radius:50%;
 border:1px solid rgba(0,242,255,.25);
 display:flex;
 justify-content:center;
 align-items:center;
}

.outer-ring{
 width:450px;
 height:450px;
 border-top:2px solid #00f2ff;
 border-bottom:2px solid #00f2ff;
 animation:rotate 10s linear infinite;
 box-shadow:0 0 20px rgba(0,242,255,.4);
}

.inner-waveform{
 width:280px;
 height:280px;
 border:4px double #ff00ff;
 box-shadow:0 0 15px rgba(255,0,255,.5);
 animation:pulse 2s ease-in-out infinite;
}

.center-core{
 width:60px;
 height:60px;
 border:8px double #00f2ff;
 border-radius:50%;
 box-shadow:0 0 20px #00f2ff;
 transition:all .4s ease;
}

/* THINKING DOTS */
.thinking-dots{
 position:absolute;
 display:flex;
 gap:6px;
 bottom:150px;
 opacity:0;
}

.thinking-dots span{
 width:6px;
 height:6px;
 background:#00f2ff;
 border-radius:50%;
 animation:blink 1.4s infinite;
}

.thinking-dots span:nth-child(2){animation-delay:.2s}
.thinking-dots span:nth-child(3){animation-delay:.4s}

/* STATUS PANEL */
.status-panel{
 position:absolute;
 bottom:80px;
 font-size:11px;
 display:flex;
 gap:25px;
 letter-spacing:1px;
}

/* DATA SIDE LABELS */
.data-label{
 position:absolute;
 font-size:12px;
 text-transform:uppercase;
}
.left{left:40px}
.right{right:40px}

/* LISTEN STATE */
.listening .outer-ring{
 animation-play-state:running;
}

/* SPEAK STATE */
.speaking .outer-ring{
 animation-play-state:paused;
}

.speaking .center-core{
 box-shadow:0 0 40px #00f2ff,0 0 60px #00f2ff;
}

/* THINKING STATE */
.thinking .outer-ring{
 animation-play-state:paused;
}

.thinking .thinking-dots{
 opacity:1;
}

.thinking .center-core{
 box-shadow:0 0 25px #ff00ff,0 0 45px #ff00ff;
}

/* ANIMATIONS */
@keyframes rotate{
 from{transform:rotate(0deg)}
 to{transform:rotate(360deg)}
}

@keyframes pulse{
 0%,100%{transform:scale(1);opacity:.8}
 50%{transform:scale(1.05);opacity:1}
}

@keyframes blink{
 0%,80%,100%{opacity:.2}
 40%{opacity:1}
}

</style>
</head>

<body>

<div class="hud-container listening" id="hud">

<div class="title">
<h1>R.U.D.R.A</h1>
<p>Your Personal Voice Assistant</p>
</div>

<div class="ring outer-ring"></div>
<div class="ring inner-waveform"></div>

<div class="center-core"></div>

<div class="thinking-dots">
<span></span><span></span><span></span>
</div>

<div class="data-label left" style="top:50%;" id="cpu">CPU: --%</div>
<div class="data-label right" style="top:50%;" id="ram">RAM: --%</div>

<div class="status-panel">
<span id="time"></span>
<span id="date"></span>
<span id="status">STATUS: LISTENING</span>
</div>

</div>

<script>

const hud=document.getElementById("hud")
const statusText=document.getElementById("status")

/* TIME + DATE */
function updateClock(){
 const now=new Date()
 document.getElementById("time").innerText="TIME: "+now.toLocaleTimeString()
 document.getElementById("date").innerText="DATE: "+now.toLocaleDateString()
}
setInterval(updateClock,1000)
updateClock()

/* STATES */
function setListening(){
 hud.classList.remove("speaking","thinking")
 hud.classList.add("listening")
 statusText.innerText="STATUS: LISTENING"
}

function setSpeaking(){
 hud.classList.remove("listening","thinking")
 hud.classList.add("speaking")
 statusText.innerText="STATUS: SPEAKING"
}

function setThinking(){
 hud.classList.remove("listening","speaking")
 hud.classList.add("thinking")
 statusText.innerText="STATUS: THINKING"
}

/* ===== PYTHON STATE CONTROL ===== */
async function checkState(){
 try{
  const res=await fetch("http://127.0.0.1:5000/state")
  const data=await res.json()

  if(data.state==="listening") setListening()
  if(data.state==="speaking") setSpeaking()
  if(data.state==="thinking") setThinking()

 }catch(e){}
}

setInterval(checkState,500)


/* CPU RAM HUD */
async function systemStats(){
 try{
  const res=await fetch("http://127.0.0.1:5000/system")
  const data=await res.json()

  document.getElementById("cpu").innerText="CPU: "+data.cpu+"%"
  document.getElementById("ram").innerText="RAM: "+data.ram+"%"

 }catch(e){}
}

setInterval(systemStats,2000)

</script>
<input type="text" id="cmd" placeholder="Ask Rudra">

<button onclick="sendCommand()">Send</button>

<h2 id="reply"></h2>
</body>
</html>
